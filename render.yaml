services:
  - type: web
    name: chesky-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        sync: false           # Cadena de conexión Postgres de Supabase
      - key: JWT_SECRET
        generateValue: true   # Render lo genera automáticamente
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPABASE_URL
        sync: false           # URL del proyecto Supabase
      - key: SUPABASE_SERVICE_KEY
        sync: false           # Clave service_role de Supabase
      - key: SUPABASE_BUCKET
        value: chesky-productos
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      - key: CORS_ORIGIN
        sync: false           # URL de Vercel, ej: https://chesky-bisuteria.vercel.app
