version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chesky_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chesky_user
      POSTGRES_PASSWORD: chesky_password
      POSTGRES_DB: chesky_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chesky_user -d chesky_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
